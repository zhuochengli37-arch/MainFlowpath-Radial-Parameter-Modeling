# AIR2 Project1 领域专用配置
# 建议直接使用：
# - python -m project1 current direct-3d
# - python -m project1 current benchmark-1d / benchmark-2d / benchmark-3d
# - python -m project1 current predict-1d / predict-2d / predict-3d
# - python workbase/current_scripts/workline_pipeline.py
# 当前推荐统一入口；如需一键串联可用 workline_pipeline.py

# ============================================
# 数据集 Schema
# ============================================
dataset_schema:
  mode: "auto"

  # 1D / 2D / 3D 工作流统一按这个输入顺序解释字段
  inputs: ["rpm", "wcor", "xi"]
  # auto: each radial partition trains the outputs actually declared by its data.
  # A list such as [Cpt, Ctt, MA] explicitly selects only those targets.
  targets: "auto"
  # error: structural target differences are explicit; skip: omit and record them.
  missing_target_policy: "error"
  # Canonical internal metadata. `rpm`/`wcor` remain compatibility aliases in
  # code; speed_parameter/flow_parameter do not prescribe component units.
  metadata: ["component", "stage", "station", "section", "speed_parameter", "flow_parameter", "xi", "schema", "source_file", "database"]

  schema_profiles:
    legacy_validation:
      description: "旧 psi/tsi/mai 验证数据及历史代理模型输入"
    institute_single_section:
      description: "研究所正式单截面数据；当前模型只使用 station=MAIN"
      fields: ["xi", "Cpt", "Ctt", "Cps", "Cts", "MA"]
    institute_four_section:
      description: "研究所 RI/RO/SI/SO 四截面数据；训练及2D/3D canonical预测core已接入，Direct-3D可输出最终宽表"
      version: "v1"
      sections: ["RI", "RO", "SI", "SO"]
      compatibility_of: "institute_multi_section"
    institute_multi_section:
      description: "通用M截面宽表；动态发现section/outputs，可进入训练及2D/3D canonical预测core"
      version: "v1"

  # path 表示优先从目录结构或文件名解析
  # column 表示从数据列中读取
  source_priority:
    component: ["path", "column"]
    stage: ["path", "column"]
    database: ["path", "column"]
    station: ["path", "column"]
    section: ["path", "column"]
    speed_parameter: ["path", "column"]
    flow_parameter: ["path", "column"]
    schema: ["path", "column"]
    source_file: ["path", "column"]
    rpm: ["path", "column"]
    wcor: ["path", "column"]
    xi: ["column"]

  aliases:
    rpm: ["rpm", "RPM", "CNC", "cnc", "CNF", "cnf"]
    wcor: ["wcor", "WCOR", "W", "w"]
    speed_parameter: ["speed_parameter", "rpm", "RPM", "CNC", "cnc", "CNF", "cnf"]
    flow_parameter: ["flow_parameter", "wcor", "WCOR", "W", "w"]
    xi: ["xi"]
    Cpt: ["Cpt", "cpt"]
    Ctt: ["Ctt", "ctt"]
    Cps: ["Cps", "cps"]
    Cts: ["Cts", "cts"]
    MA: ["MA", "ma"]
    VX: ["VX", "vx"]
    RHO: ["RHO", "rho"]

  # 目标值中的 -999.0 视为缺失值
  missing_value_sentinels: [-999.0]

  partition:
    mode: "config"
    keys: ["component", "stage"]

# ============================================
# 3D Benchmark
# ============================================
benchmark_3d:
  paths:
    # 训练数据目录
    input: "./data/current/3d/CASE3/train"
    output: "./data/current/3d/CASE3/output"
    # 模型、排行榜、报告等输出目录

  radial_mode: "full"  # mean: 只取 xi 最小和最大两行；full: 使用全部径向行
  partition_mode: "multi"
  n_splits: 3
  max_samples: 10000
  include_gpr: true

  # 分区模式说明：
  # - multi: Single按部件+级数；Multi-Section再加入实际section，当前默认推荐
  # - component: 按部件分区，同一部件下多个级合并训练
  # - single: 所有样本混合训练，最省样本
  # - family: 按部件家族分区，适合相近物理类别共享样本

# ============================================
# 2D Benchmark
# ============================================
benchmark_2d:
  paths:
    input: "./data/current/3d/CASE2-2/train"
    output: "./data/current/3d/CASE2-2/output_2d"

  radial_mode: "full"
  partition_mode: "multi"
  n_splits: 3
  max_samples: 10000
  include_gpr: false

# ============================================
# 1D Benchmark
# ============================================
benchmark_1d:
  paths:
    input: "./data/current/3d/CASE2-2/train"
    output: "./data/current/3d/CASE2-2/output_1d"

  n_splits: 5
  max_samples: 10000
  include_gpr: false

# ============================================
# 3D Predict
# ============================================
predict_3d:
  paths:
    input: "./data/current/3d/CASE3/predict"
    model_output: "./data/current/3d/CASE3/output"
    output: "./data/current/3d/CASE3/results"

  partition: null
  model_name: null
  selection_split_mode: "condition"  # 可选：condition / random / rpm / wcor / any
  selection_metric: "rmse"        # 可选：rmse / mape / mae
  save_results: true
  result_format: "both"
  generate_report: true

# ============================================
# 2D Predict
# ============================================
predict_2d:
  paths:
    input: "./data/current/3d/CASE2-2/predict"
    model_output: "./data/current/3d/CASE2-2/output_2d"
    output: "./data/current/3d/CASE2-2/results_2d"

  partition: null
  save_results: true
  result_format: "both"
  generate_report: true

# ============================================
# 1D Predict
# ============================================
predict_1d:
  paths:
    input: "./data/current/3d/CASE2-3/predict"
    model_output: "./data/current/3d/CASE2-2/output_1d"
    output: "./data/current/3d/CASE2-3/results_1d"

  save_results: true
  result_format: "both"
  generate_report: true

# Direct-3D 模型目录以 project1.modeling.registry 为唯一来源；这里不再维护
# 一份不会被运行时读取的重复列表。GPR 是否参与仍由 include_gpr 控制。

# ============================================
# 高级配置
# ============================================
advanced:
  random_state: 42
  n_jobs: -1
  verbose: true
  log_dir: "./logs"

# ============================================
# 性能配置
# ============================================
performance:
  early_stopping: false
  early_stopping_rounds: 10
  use_gpu: false
  memory_limit: null

# ============================================
# 输出配置
# ============================================
output:
  save_models: true
  generate_leaderboard: true
  generate_report: true
  report_format: "markdown"
