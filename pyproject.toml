[build-system]
requires = ["setuptools>=65.5", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "project1"
version = "0.1.0"
description = "Offline Python project scaffold"
readme = "README.md"
requires-python = ">=3.9"
authors = [
  { name = "Your Name" }
]
dependencies = [
  "python-dotenv>=1.0.0",
  "pyyaml>=6.0.0",
  "tqdm>=4.66.0",
  "numpy==1.26.4",
  "scipy==1.12.0",
  "scikit-learn==1.7.2",
  "pandas==2.2.1",
  "matplotlib==3.10.9",
  "xgboost==3.2.0",
  "lightgbm==4.6.0",
]

[project.optional-dependencies]
phase2a = [
  "pygam==0.12.0; python_version >= '3.10'",
  "interpret-core==0.7.8; python_version >= '3.10'",
  "catboost==1.2.10",
  "ngboost==0.5.11",
]
phase2b = [
  "torch==2.2.1",
  "pytabkit==1.7.3",
  "pykan==0.2.8",
  "skorch==1.2.0",
]
phase2c = [
  "tabicl==2.2.0",
]

[tool.setuptools]
package-dir = {"" = "workbase/src"}

[tool.setuptools.packages.find]
where = ["workbase/src"]

[project.scripts]
project1 = "project1.cli:main"
